<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Task Mining — Create Your Account</title>
<style>
:root{--bg:#071421;--blue:#63c5ff;--blue2:#2877cf;--text:#eff8ff;--muted:#a9c5dc;--red:#ff7180;--green:#66dfa0;--bag:#9a5a3d;--bagdark:#382014;--gold-1:#f8ecdc;--gold-2:#d9b878;--gold-3:#a9793b;--gold-4:#f3d49e}.page{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#f4f0eb 0%,#f0ebe5 30%,#f4efe8 100%)}.page:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 53%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.75) 18%,rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 60%,rgba(214,180,111,.55),transparent 28%);opacity:1}.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.1),rgba(255,255,255,.45));mix-blend-mode:screen;opacity:.9}
.floor{position:absolute;bottom:-8%;width:100%;height:30%;background:linear-gradient(180deg,transparent,#0000),radial-gradient(ellipse at center,rgba(133,190,255,.12),transparent 65%);border-top:1px solid rgba(255,255,255,.08);z-index:1}.luxury-backdrop{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}.luxury-backdrop .rays{position:absolute;inset:-6% -10% -12% -10%;background:repeating-linear-gradient(90deg,rgba(122,101,74,.18) 0 2px,rgba(255,255,255,0) 2px 15px),repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,rgba(255,255,255,0) 1px 10px);transform:scaleY(1.1) rotate(0deg);opacity:.8;filter:blur(.1px)}.luxury-backdrop .halo{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:88vmin;height:88vmin;border-radius:50%;background:radial-gradient(circle at center,#fff0d4 0%,rgba(255,230,177,.85) 18%,rgba(195,153,98,.28) 30%,rgba(195,153,98,0) 60%);box-shadow:0 0 80px rgba(211,167,85,.45)}.luxury-backdrop .ring{position:absolute;left:50%;top:24%;transform:translateX(-50%);width:72vmin;height:72vmin;border-radius:50%;border:10px solid rgba(166,120,52,.95);background:radial-gradient(circle at center,rgba(255,255,255,.8) 0%,rgba(254,240,209,.6) 30%,rgba(214,172,92,.25) 42%,transparent 70%);box-shadow:0 0 50px rgba(169,125,62,.3),inset 0 0 22px rgba(148,103,40,.4)}.luxury-backdrop .ring:before{content:"";position:absolute;inset:2.5%;border-radius:50%;background:radial-gradient(circle at center,rgba(255,255,255,.75),rgba(255,255,255,.16) 44%,transparent 60%);opacity:.9}.luxury-backdrop .ring:after{content:"";position:absolute;inset:-6%;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(166,120,52,.45),0 0 26px rgba(210,180,120,.2)}.luxury-backdrop .spark{position:absolute;left:50%;top:24%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffefb4 25%,#d8ae58 70%,rgba(216,174,88,0) 100%);box-shadow:0 0 20px rgba(255,215,128,.9),0 0 45px rgba(255,215,128,.8);transform:translate(-50%,-50%)}.luxury-backdrop .spark.s1{left:48%;top:17%}.luxury-backdrop .spark.s2{left:58%;top:16%}.luxury-backdrop .spark.s3{left:69%;top:22%}.luxury-backdrop .spark.s4{left:80%;top:32%}.luxury-backdrop .spark.s5{left:35%;top:22%}.luxury-backdrop .spark.s6{left:22%;top:33%}.luxury-backdrop .spark.s7{left:76%;top:67%}.luxury-backdrop .spark.s8{left:24%;top:65%}.luxury-backdrop .spark.s9{left:50%;top:80%}.luxury-backdrop .spark.s10{left:50%;top:14%}.luxury-backdrop .pedestal{position:absolute;left:50%;bottom:16vh;transform:translateX(-50%);width:54vmin;height:16vmin;border-radius:50% 50% 30% 30%/56% 56% 40% 40%;background:linear-gradient(180deg,#f8e6ba,#d3a95a 30%,#b07b38 55%,#efd9a8 100%);box-shadow:0 0 0 10px rgba(205,176,110,.7),0 0 30px rgba(160,123,54,.35);opacity:.92}.luxury-backdrop .pedestal:before,.luxury-backdrop .pedestal:after{content:"";position:absolute;border-radius:50%;left:50%;transform:translateX(-50%)}.luxury-backdrop .pedestal:before{bottom:-18%;width:60%;height:34%;background:linear-gradient(180deg,#e2bd73,#a67838);box-shadow:0 0 0 8px rgba(188,146,70,.7)}.luxury-backdrop .pedestal:after{bottom:-32%;width:74%;height:44%;background:linear-gradient(180deg,#f0d8a6,#b58442);box-shadow:0 0 0 8px rgba(183,141,62,.72)}
*{box-sizing:border-box}.female-character{position:absolute;z-index:4;left:0;bottom:7vh;width:260px;height:430px;opacity:0;transform:translateX(-130vw) scale(.8)}.female-character.entering{animation:enter 3.2s cubic-bezier(.22,1,.36,1) forwards}@keyframes enter{0%{opacity:0;transform:translateX(-130vw) scale(.72)}18%{opacity:1}100%{opacity:1;transform:translateX(10vw) scale(1)}}.female-body{position:absolute;inset:0;transform-origin:center bottom}.walking .female-body{animation:walk .7s ease-in-out infinite alternate}@keyframes walk{to{transform:translateY(-5px) rotate(1deg)}}.head{position:absolute;top:28px;left:96px;width:70px;height:73px;border-radius:50%;background:#efc39f;z-index:3}.hair{position:absolute;z-index:4;top:10px;left:87px;width:88px;height:94px;border-radius:48%;background:linear-gradient(150deg,#29202a,#090b12)}.hair:after{content:"";position:absolute;right:-12px;top:28px;width:28px;height:96px;border-radius:50%;background:#101018}.eye{position:absolute;z-index:5;top:57px;width:6px;height:6px;border-radius:50%;background:#30232b}.eye.one{left:116px}.eye.two{left:139px}.mouth{position:absolute;z-index:5;top:76px;left:123px;width:18px;height:9px;border-bottom:3px solid #9e655d;border-radius:50%}.neck{position:absolute;top:91px;left:124px;width:17px;height:25px;background:#dca982;border-radius:9px}.torso{position:absolute;top:109px;left:73px;width:120px;height:145px;border-radius:28px 28px 20px 20px;background:linear-gradient(#f6f9ff,#cfdeef 55%,#9fb9d5);box-shadow:inset 0 -18px #2850781a}.torso:before{content:"";position:absolute;top:18px;left:23px;width:74px;height:45px;border-radius:14px;background:#466e961f}.arm{position:absolute;top:126px;width:23px;height:128px;border-radius:20px;background:linear-gradient(#e8b78e,#cf9368);transform-origin:top center}.arm.left{left:52px;transform:rotate(38deg)}.arm.right{right:50px;transform:rotate(-38deg)}.hand{position:absolute;bottom:-9px;left:-3px;width:29px;height:20px;border-radius:50%;background:#e8b78e}.leg{position:absolute;bottom:0;width:30px;height:165px;border-radius:22px;background:linear-gradient(#263243,#0d131c)}.leg.left{left:106px}.leg.right{left:143px}.shoe{position:absolute;bottom:-5px;width:48px;height:22px;border-radius:50%;background:#171b24}.shoe.left{left:96px}.shoe.right{left:137px}.female-character.stop{transform:translateX(10vw) scale(1);transition:transform .7s ease}.bending .female-body{transform:translateY(15px) rotate(6deg);transition:.8s}.bending .arm.right{transform:rotate(-62deg) translateY(13px);transition:.8s}.female-character.final{transform:translateX(16vw) scale(1);transition:1s}.final .female-body{transform:rotate(-3deg)}
.handbag{position:absolute;z-index:6;right:27vw;bottom:5vh;width:190px;height:170px;opacity:0;transform:translateY(140px) scale(.7)}.handbag.visible{opacity:1;transition:opacity .6s}.handbag.placed{transform:translateY(0) scale(1);transition:transform 1s cubic-bezier(.22,1,.36,1)}.bag-handle{position:absolute;z-index:1;top:-23px;left:52px;width:78px;height:88px;border:10px solid #b7744f;border-bottom:0;border-radius:50px 50px 0 0}.bag-body{position:absolute;bottom:0;left:20px;width:150px;height:116px;border-radius:18px 18px 28px 28px;background:linear-gradient(135deg,#c77e57,var(--bag) 45%,var(--bagdark));box-shadow:0 18px 27px #0006,inset 0 -15px #0002}.bag-flap{position:absolute;z-index:3;top:22px;left:17px;width:156px;height:78px;border-radius:15px;border:2px solid #653a28;background:linear-gradient(135deg,#d28a61,#77452f);transform-origin:top center;transition:.9s cubic-bezier(.22,1,.36,1)}.bag-flap:after{content:"";position:absolute;top:12px;left:50%;width:11px;height:11px;border-radius:50%;background:#442719;transform:translateX(-50%)}.open .bag-flap{transform:rotateX(-112deg) translateY(-12px)}.bag-light{position:absolute;z-index:2;left:25px;bottom:15px;width:145px;height:85px;opacity:0;border-radius:50%;background:radial-gradient(circle,#ffd57dcc,transparent 68%);filter:blur(8px);transition:.8s}.open .bag-light{opacity:1}
.registration-card{position:fixed;z-index:20;left:50%;top:50%;width:min(440px,calc(100vw - 20px));max-height:84dvh;overflow-y:auto;border:1px solid #82caff59;border-radius:24px;background:#0c1b29f5;box-shadow:0 25px 60px #0007,0 0 35px #4eaefd47;opacity:0;visibility:hidden;transform:translate(-50%,-50%) scale(.08) rotate(-8deg);transform-origin:center}.registration-card.show{visibility:visible;opacity:1;transition:left 1.4s cubic-bezier(.22,1,.36,1),top 1.4s cubic-bezier(.22,1,.36,1),transform 1.4s cubic-bezier(.22,1,.36,1),opacity .5s}.card-content{padding:25px 22px 18px}.heading{text-align:center;margin-bottom:17px}.heading h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem)}.heading p{margin:8px 0 0;color:var(--muted);font-size:.92rem}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:.74rem;font-weight:bold;text-transform:uppercase}.field input{width:100%;padding:12px 13px;color:var(--text);outline:none;border:1px solid #add8ff2e;border-radius:11px;background:#ffffff0e}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #54baff1f}.field small{min-height:14px;color:var(--red);font-size:.68rem;opacity:0}.field.invalid small{opacity:1}.field.invalid input{border-color:var(--red)}.register-btn{grid-column:1/-1;margin-top:8px;padding:14px;border:0;border-radius:12px;color:#061321;background:linear-gradient(135deg,var(--blue),var(--blue2));font-weight:bold;cursor:pointer;box-shadow:0 10px 25px #2a87dc59}.login{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.88rem}.login a{color:var(--blue);font-weight:bold;text-decoration:none}.message{position:absolute;z-index:25;top:14vh;right:12vw;max-width:250px;padding:15px 21px;border:1px solid #addcff33;border-radius:17px;background:#091927cc;box-shadow:0 15px 30px #0003;font-size:1rem;font-weight:bold;opacity:0;transform:translateY(20px) scale(.9);transition:.8s}.message.visible{opacity:1;transform:translateY(0) scale(1)}
@media(max-width:700px){.female-character{left:-45px;bottom:15vh;width:190px;height:315px;transform:translateX(-100vw) scale(.58);transform-origin:bottom center}.female-character.stop{transform:translateX(25px) scale(.58)}.female-character.final{transform:translateX(-4px) scale(.47);bottom:14vh}.handbag{right:5vw;bottom:12vh;width:135px;height:120px;transform:translateY(120px) scale(.58)}.handbag.placed{transform:translateY(0) scale(.58)}.registration-card{width:calc(100vw - 20px);max-width:390px;max-height:80dvh}.card-content{padding:18px 14px 15px}.form-grid{display:block}.field{margin-bottom:8px}.field input{min-height:42px;padding:10px 11px;font-size:.9rem}.register-btn{width:100%;min-height:44px}.message{top:6vh;right:6vw;max-width:215px;padding:11px 14px;text-align:center;font-size:.78rem}.luxury-backdrop .ring{width:78vmin;height:78vmin;top:18%}.luxury-backdrop .pedestal{bottom:12vh;width:60vmin;height:16vmin}.luxury-backdrop .halo{top:14%;width:80vmin;height:80vmin}}@media(max-width:380px){.registration-card{width:calc(100vw - 12px);max-height:78dvh}.heading h1{font-size:1.35rem}.female-character.final{transform:translateX(-10px) scale(.42)}.handbag{right:2vw;transform:translateY(120px) scale(.48)}.handbag.placed{transform:translateY(0) scale(.48)}}
</style>
</head>
<body>
<main class="page">
<div class="floor"></div>
<div class="luxury-backdrop" aria-hidden="true">
  <div class="rays"></div>
  <div class="halo"></div>
  <div class="ring"></div>
  <div class="spark s1"></div>
  <div class="spark s2"></div>
  <div class="spark s3"></div>
  <div class="spark s4"></div>
  <div class="spark s5"></div>
  <div class="spark s6"></div>
  <div class="spark s7"></div>
  <div class="spark s8"></div>
  <div class="spark s9"></div>
  <div class="spark s10"></div>
  <div class="pedestal"></div>
</div>
<section class="female-character entering" id="female"><div class="female-body"><div class="hair"></div><div class="head"></div><div class="eye one"></div><div class="eye two"></div><div class="mouth"></div><div class="neck"></div><div class="torso"></div><div class="arm left"><div class="hand"></div></div><div class="arm right"><div class="hand"></div></div><div class="leg left"></div><div class="leg right"></div><div class="shoe left"></div><div class="shoe right"></div></div></section>
<section class="handbag" id="handbag"><div class="bag-handle"></div><div class="bag-body"></div><div class="bag-light"></div><div class="bag-flap"></div></section>
<section class="registration-card" id="card"><div class="card-content"><header class="heading"><h1>Create Your Account</h1><p>Register now and get started</p></header><form id="form" novalidate><div class="form-grid">
<div class="field"><label for="username">Username</label><input id="username" placeholder="Enter username"><small></small></div>
<div class="field"><label for="email">Gmail / Email</label><input id="email" type="email" placeholder="you@example.com"><small></small></div>
<div class="field"><label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="+1 234 567 890"><small></small></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="Minimum 8 characters"><small></small></div>
<div class="field full"><label for="confirm">Re-enter Password</label><input id="confirm" type="password" placeholder="Confirm password"><small></small></div>
<div class="field full"><label for="invite">Invite Code</label><input id="invite" placeholder="Enter invite code"><small></small></div>
<button class="register-btn" type="submit">Register Now</button><div class="login">Already have an account? <a href="#" id="login">Login</a></div></div></form></div></section>
<div class="message" id="message">Please Register Your Account</div>
</main>
<script>
const female=document.getElementById('female'),bag=document.getElementById('handbag'),card=document.getElementById('card'),message=document.getElementById('message');
function start(){setTimeout(()=>female.classList.add('walking'),550);setTimeout(()=>{female.classList.remove('walking');female.classList.add('stop')},3600);setTimeout(()=>{female.classList.remove('stop');female.classList.add('bending')},4500);setTimeout(()=>{bag.classList.add('visible','placed')},5350);setTimeout(()=>bag.classList.add('open'),6250);setTimeout(()=>{const r=bag.getBoundingClientRect();card.style.left=r.left+r.width/2+'px';card.style.top=r.top+r.height*.3+'px';card.style.transform='translate(-50%,-50%) scale(.08) rotate(-8deg)';card.classList.add('show')},7100);setTimeout(()=>card.style.transform='translate(-50%,-50%) scale(.55) rotate(-4deg)',7700);setTimeout(()=>{card.style.left='50%';card.style.top='50%';card.style.transform='translate(-50%,-50%) scale(1.04) rotate(1deg)'},8500);setTimeout(()=>card.style.transform='translate(-50%,-50%) scale(1) rotate(0deg)',9500);setTimeout(()=>{female.classList.remove('bending');female.classList.add('final')},10300);setTimeout(()=>message.classList.add('visible'),11400)}window.addEventListener('load',start);
const form=document.getElementById('form');function state(el,ok,text=''){const f=el.closest('.field');f.classList.toggle('invalid',!ok);f.querySelector('small').textContent=text}form.addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username'),em=document.getElementById('email'),ph=document.getElementById('phone'),pw=document.getElementById('password'),cp=document.getElementById('confirm'),iv=document.getElementById('invite');let ok=true;if(u.value.trim().length<3){state(u,false,'Username must be at least 3 characters.');ok=false}else state(u,true);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){state(em,false,'Enter a valid email address.');ok=false}else state(em,true);if(!/^[0-9+\s()-]{8,20}$/.test(ph.value.trim())){state(ph,false,'Enter a valid phone number.');ok=false}else state(ph,true);if(pw.value.length<8){state(pw,false,'Password must be at least 8 characters.');ok=false}else state(pw,true);if(cp.value!==pw.value||cp.value.length<8){state(cp,false,'Passwords must match.');ok=false}else state(cp,true);if(iv.value.trim().length<3){state(iv,false,'Invite code is required.');ok=false}else state(iv,true);if(ok){const b=form.querySelector('button');b.disabled=true;b.textContent='Account Created';b.style.background='linear-gradient(135deg,#66dfa0,#35a66b)';setTimeout(()=>{b.disabled=false;b.textContent='Register Now';b.style.background='';form.reset()},1800)}});form.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>state(i,true)));document.getElementById('login').onclick=e=>{e.preventDefault();alert('Login page can be connected here.')};
</script>
</body>
</html>
